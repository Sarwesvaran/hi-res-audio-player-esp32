; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
; board = esp32dev
board = esp-wrover-kit 
framework = arduino
board_build.partitions = huge_app.csv
build_src_filter = +<main.cpp> -<nvs_erase.cpp>
monitor_speed = 115200
; CRITICAL: Force PSRAM capability
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=5 ; Shows detailed errors in Serial Monitor
	
lib_deps = z3t0/IRremote@^4.7.1
	adafruit/Adafruit SSD1306@^2.5.16
	esphome/ESP32-audioI2S@^2.3.0
	https://github.com/pschatzmann/ESP32-A2DP.git ; For Bluetooth (Git version is best)
